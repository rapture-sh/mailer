name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# Every Linux job here runs on Blacksmith, which needs the Blacksmith GitHub App installed
# on this repository. Stay on 2vcpu: a job asking for a label this account's plan does not
# serve, which is any larger size and every `blacksmith-*-arm` label, is accepted and then
# queues forever rather than failing.
#
# Blacksmith also intercepts the Actions cache API, and can answer
# `400 Default branch not found for repository` for a repository it has not picked up yet,
# which makes the `actions/setup-node` cache step warn. That is their end. Drop the cache
# line rather than debugging it.
jobs:
  release:
    name: Release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance, which is what lets the registry attest that this
      # tarball was built by this workflow from this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, and the npm a Node release ships
      # with is older than that often enough to be worth pinning rather than hoping.
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # Opens and maintains the version pull request while changesets are pending. It is
      # given no `publish` input, because the step below is the publish.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # npm, because `changeset publish` publishes with pnpm in a pnpm repository and pnpm
      # does not do the OIDC exchange that trusted publishing needs. No NODE_AUTH_TOKEN
      # for the same reason the exchange works at all: an empty one writes an empty auth
      # line into the .npmrc that setup-node generates, and npm tries that first.
      #
      # The registry is asked about the version first because this step runs on every push
      # to main, and `npm publish` over a version that is already there fails the job.
      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already published."
            exit 0
          fi

          pnpm build
          npm publish
          pnpm changeset git-tag

      # The tags are written locally by the step above, and a run that published nothing
      # has none to push, so this does nothing on an ordinary commit.
      - run: git push --tags
