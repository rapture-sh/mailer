name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# This is the one job in the repository that does not run on Blacksmith. The registry
# refuses a provenance statement built on a self-hosted runner, which is what Blacksmith is
# as far as it is concerned:
#
#   422 Unprocessable Entity: Error verifying sigstore provenance bundle: Unsupported
#   GitHub Actions runner environment: "self-hosted". Only "github-hosted" runners are
#   supported when publishing with provenance.
#
# Provenance is most of the point of trusted publishing, so the runner is what gives way.
# checks.yml is unaffected and stays on Blacksmith.
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance, which is what lets the registry attest that this
      # tarball was built by this workflow from this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, and the npm a Node release ships
      # with is older than that often enough to be worth pinning rather than hoping.
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # Before the version pull request step, not after it. That step runs
      # `changeset version`, which rewrites package.json in this job's tree to the version
      # nobody has merged yet, and publishing from that ships it early: the run that merged
      # the pull request these notes came from tried to publish 0.2.0 straight off main.
      #
      # npm, because `changeset publish` publishes with pnpm in a pnpm repository and pnpm
      # does not do the OIDC exchange that trusted publishing needs. No NODE_AUTH_TOKEN
      # for the same reason the exchange works at all: an empty one writes an empty auth
      # line into the .npmrc that setup-node generates, and npm tries that first.
      #
      # The registry is asked about the version first because this runs on every push to
      # main, and `npm publish` over a version that is already there fails the job.
      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already published."
            exit 0
          fi

          pnpm build
          npm publish

          # git rather than `changeset git-tag`, which builds its list of what to tag from
          # @manypkg/get-packages. There is no pnpm-workspace.yaml here, so that finds no
          # packages, reports "Did not find any packages that need to be tagged" and exits
          # 0: the 0.1.1 release went out untagged and the push below had nothing to send.
          # The version is already in hand here anyway.
          git tag "v$version"

      # The tag is written locally by the step above, and a run that published nothing has
      # none to push, so this does nothing on an ordinary commit.
      - run: git push --tags

      # Opens and maintains the version pull request while changesets are pending. It is
      # given no `publish` input, because the step above is the publish.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
